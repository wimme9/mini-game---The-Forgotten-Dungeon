<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>High Lord Dungeon</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        @font-face {
            font-family: 'FirlestFont';
            src: url('assets/Firlest-Regular.otf') format('opentype');
        }
        body { margin: 0; background: #000; }
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>
    <script>
        // Wait for custom font to load into DOM before starting Game.js
        document.fonts.load('10px "FirlestFont"').then(function() {
            const script = document.createElement('script');
            script.type = 'module';
            script.src = 'Game.js';
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
