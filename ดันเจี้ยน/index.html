<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>My Room Dungeon Game</title>

    <!-- ฟอนต์ธีมดันเจี้ยน: Cinzel สำหรับหัวเรื่องอังกฤษ, Noto Sans Thai สำหรับเนื้อหาไทย -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle at 50% 30%, #241a12 0%, #0d0805 75%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            border: 6px solid #3a2a18;
            outline: 2px solid #8a6d3b;
            outline-offset: -10px;
            border-radius: 6px;
            background-color: #1a1a1a;
            box-shadow: 0 0 40px rgba(0,0,0,0.9), 0 0 90px rgba(212,175,55,0.12);
        }
    </style>
</head>
<body>

    <!-- พื้นที่วาดเกม -->
    <canvas id="gameCanvas" width="1000" height="600"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

    <script type="module" src="Game.js"></script>
</body>
</html>
